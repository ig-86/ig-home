feed:
  fields:
    pet:
      required: true
      example: "pamuk"
      selector:
        text:
    undo:
      default: false
      selector:
        boolean:
control:
  fields:
    entity_id:
      required: true
      example: "light.alt_kat_wc_tavan_govee"
      selector:
        entity:
          multiple: true
          domain:
            - light
            - switch
            - fan
            - input_boolean
    action:
      default: toggle
      selector:
        select:
          options:
            - toggle
            - turn_on
            - turn_off
    brightness_pct:
      selector:
        number:
          min: 1
          max: 100
          unit_of_measurement: "%"
    color_temp_kelvin:
      selector:
        number:
          min: 2000
          max: 9000
          unit_of_measurement: K
snooze_automation:
  fields:
    entity_id:
      required: true
      example: "automation.giris_isik_sensor"
      selector:
        entity:
          multiple: true
          domain: automation
    minutes:
      default: 60
      selector:
        number:
          min: 0
          max: 2880
          unit_of_measurement: min
